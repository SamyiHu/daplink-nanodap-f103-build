name: build-daplink-f103-interface
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone DAPLink v0258 with submodules
        run: |
          git clone --depth 1 --branch v0258 --recurse-submodules --shallow-submodules https://github.com/ARMmbed/DAPLink.git
          cd DAPLink && git submodule status | head -5
      - name: Install python deps
        run: pip3 install -r DAPLink/requirements.txt
      - name: Install arm-none-eabi-gcc 10.3
        run: |
          curl -sS -O -L https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.07/gcc-arm-none-eabi-10.3-2021.07-x86_64-linux.tar.bz2
          sudo mkdir -p /opt/arm-gcc
          sudo tar jxf gcc-arm-none-eabi-10.3-2021.07-x86_64-linux.tar.bz2 -C /opt/arm-gcc --strip-components 1
          /opt/arm-gcc/bin/arm-none-eabi-gcc --version | head -1
      - name: Generate and build stm32f103xb_stm32f103rb_if
        run: |
          export PATH=/opt/arm-gcc/bin:$PATH
          cd DAPLink
          progen generate -t gcc_arm -p stm32f103xb_stm32f103rb_if
          echo "--- makefiles found ---"
          find . -maxdepth 5 -name Makefile | head -10
          MKDIR=$(dirname "$(find . -maxdepth 6 -name Makefile -path '*stm32f103rb*' | head -1)")
          echo "building in: $MKDIR"
          make -C "$MKDIR" all
          echo "--- built artifacts ---"
          find . -name '*_crc.bin' -o -name '*_crc.hex' | head -10
          mkdir -p ../out
          find . \( -name '*_crc.bin' -o -name '*_crc.hex' \) -exec cp {} ../out/ \;
          ls -la ../out/
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: daplink-f103-if
          path: out/*
          if-no-files-found: error
